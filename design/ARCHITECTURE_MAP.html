<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色卡架构设计图（交互式）</title>
<style>
  :root {
    --bg:#f5f6f8; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-soft:#eff6ff;
    --ok:#16a34a; --warn:#d97706; --no:#dc2626; --chip:#f1f5f9;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 12px 80px; background:var(--bg); color:var(--ink);
         font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif; line-height:1.6; }
  .wrap { max-width:1100px; margin:0 auto; }
  header h1 { margin:0 0 6px; font-size:24px; }
  header p { margin:0 0 4px; color:var(--muted); font-size:14px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; margin:14px 0 18px; font-size:13px; }
  .legend span::before { content:"● "; font-weight:bold; }
  .legend .ok::before{color:var(--ok);} .legend .warn::before{color:var(--warn);} .legend .no::before{color:var(--no);}

  .tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab { padding:8px 16px; border:1px solid var(--line); border-radius:999px;
         background:var(--card); cursor:pointer; font-size:14px; }
  .tab.active { background:var(--ink); color:#fff; border-color:var(--ink); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px 20px; margin-bottom:16px; }
  .card h2 { margin:0 0 6px; font-size:17px; }
  .card .note { color:var(--muted); font-size:13px; margin:0 0 14px; }

  /* 链路视图 */
  .chain-bar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .chain-btn { padding:6px 14px; border:1px solid var(--line); border-radius:8px;
               background:var(--card); cursor:pointer; font-size:13px; }
  .chain-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .flow { display:flex; flex-wrap:wrap; align-items:stretch; gap:6px; }
  .node { flex:1 1 150px; min-width:130px; border:1px solid var(--line); border-radius:10px;
          background:var(--card); padding:10px 12px; cursor:pointer; position:relative; }
  .node:hover { border-color:var(--accent); background:var(--accent-soft); }
  .node.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); background:var(--accent-soft); }
  .node .t { font-weight:600; font-size:13px; }
  .node .r { color:var(--muted); font-size:11px; margin-top:2px; }
  .node .kids { position:absolute; right:6px; top:6px; background:var(--chip); border-radius:999px;
                padding:0 6px; font-size:10px; color:var(--muted); }
  .arrow { align-self:center; color:var(--muted); font-size:18px; flex:0 0 auto; }

  /* 钻取详情 */
  .drill { border-top:1px dashed var(--line); margin-top:14px; padding-top:12px; }
  .crumb { font-size:13px; color:var(--muted); margin-bottom:8px; }
  .crumb b { color:var(--ink); }
  .crumb a { color:var(--accent); cursor:pointer; }
  .drill .summary { font-size:14px; margin-bottom:10px; }
  .drill .summary .role { display:inline-block; background:var(--chip); border-radius:6px;
                          padding:1px 8px; font-size:12px; color:var(--muted); margin-right:6px; }
  .subgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
  .sub { border:1px solid var(--line); border-radius:8px; padding:9px 11px; cursor:pointer; font-size:13px; }
  .sub:hover { border-color:var(--accent); background:var(--accent-soft); }
  .sub .t { font-weight:600; }
  .sub .d { color:var(--muted); font-size:12px; margin-top:2px; }
  .back { color:var(--accent); cursor:pointer; font-size:13px; }

  /* 树视图 */
  .tree ul { list-style:none; margin:0; padding-left:18px; }
  .tree > ul { padding-left:0; }
  .tree li { margin:2px 0; }
  .tnode { display:inline-flex; align-items:center; gap:6px; cursor:pointer; padding:3px 8px;
           border-radius:6px; font-size:14px; }
  .tnode:hover { background:var(--accent-soft); }
  .tnode .tw { transition:transform .15s; font-size:11px; color:var(--muted); }
  .tnode.open .tw { transform:rotate(90deg); }
  .tnode .badge { font-size:10px; background:var(--chip); border-radius:999px; padding:0 7px; color:var(--muted); }
  .tnode.warn { color:var(--warn); }
  .tnode.no { color:var(--no); }
  .desc { color:var(--muted); font-size:12px; margin-left:4px; }

  .pending li { margin:8px 0; font-size:14px; }
  .pending .warn { color:var(--warn); font-weight:bold; }
  .empty { color:var(--muted); font-size:14px; padding:16px 0; }

  /* 功能清单视图 */
  .features .feat { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .features .feat:hover { border-color:var(--accent); }
  .feat .fh { font-size:15px; margin-bottom:6px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .feat .fl { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:4px 12px; font-size:12px; }
  .feat .fl span { display:block; }
  .feat .fl i { font-style:normal; color:var(--muted); margin-right:4px; }
  .features .ok { color:var(--ok); }
  .features .warn { color:var(--warn); }
  .features .no { color:var(--no); }

  footer { color:var(--muted); font-size:12px; margin-top:20px; }
  code { background:#eef0f3; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>角色卡架构设计图（交互式）</h1>
  <p>点任意模块往下钻；绿色=已定稿，黄色=设计待拍板，红色=已否掉。改设计 = 只改本文件 <code>ARCH_DATA</code>。设计没敲定看「设计待拍板」；设计定了代码没做的看「实现待办」，两者彻底分开。</p>
  <p style="color:#b78a2f">⚙️ <b>数值约定（全图通用）</b>：所有涉及数值的设计（条数、分钟数、阈值、次数、间隔……），前端一律允许自定义、不写死；本图写的数字 = 本版默认值（用户不改就按这个跑）。</p>
</header>

<div class="legend">
  <span class="ok">已定稿</span>
  <span class="warn">待拍板</span>
  <span class="no">已否掉</span>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-view="chains">链路钻取</div>
  <div class="tab" data-view="tree">总览树</div>
  <div class="tab" data-view="features">功能清单</div>
  <div class="tab" data-view="pending">设计待拍板</div>
  <div class="tab" data-view="todo">实现待办</div>
</div>

<!-- 链路钻取视图 -->
<div id="view-chains">
  <div class="chain-bar" id="chainbar"></div>
  <div class="card">
    <div class="flow" id="flow"></div>
    <div class="drill" id="drill"></div>
  </div>
</div>

<!-- 总览树视图 -->
<div id="view-tree" style="display:none">
  <div class="card tree" id="tree"></div>
</div>

<!-- 功能清单视图（全功能盘点：防止重构漏迁） -->
<div id="view-features" style="display:none">
  <div class="card features" id="features"></div>
</div>

<!-- 待拍板清单视图（纯设计层：只放设计还没敲定的） -->
<div id="view-pending" style="display:none">
  <div class="card pending" id="pending"></div>
</div>

<!-- 实现待办视图（代码层：设计已定稿，只是还没写进代码） -->
<div id="view-todo" style="display:none">
  <div class="card pending" id="todo"></div>
</div>

<footer>
  维护：编辑本文件底部的 <code>ARCH_DATA</code>（纯 JS 对象），保存后刷新即可。无需联网、无 CDN。
</footer>
</div>

<script>
/* ================================================================
   架构数据 —— 唯一真相源。改架构就改这里。
   每个节点字段：
     t   标题
     r   角色/定位（小字，可选）
     d   它干了什么（描述）
     k   children 子节点数组（可继续钻）
     s   状态：'ok' 已定稿 / 'warn' 待拍板 / 'no' 已否掉（可选）
   ================================================================ */
const ARCH_DATA = {

chains: [
  {
    id:'reply', name:'① 消息回复链路',
    nodes:[
      {t:'IM 消息', r:'入站', d:'群聊 / 私聊消息', s:'ok', k:[]},
      {t:'gateway 入站（网关）', r:'协议接入层', d:'把 消息协议（IM 接入协议）事件转成内部标准事件；raw_payload（原始载荷）无损归档（含 mapping_version 转译版本标记，转译错可复盘）', s:'ok', k:[
        {t:'parse 解析', d:'消息协议（IM 接入协议）→ 标准事件（sender 说话人 / chat_type 会话类型 / target_id 会话对象 / clean_message 干净文本）'},
        {t:'_dump_raw 归档', d:'原始载荷紧凑 JSON 落库，不丢字节'},
        {t:'enrich 图片富化', d:'已接入（2026-11-06 复核）：投递 planner 前调用 enrich 下载图片、回填 images_json，供 VisionWorker 入队'},
      ]},
      {t:'planner 防抖批次（调度器）', r:'后台 8000', d:'消息进 Debouncer（防抖器）攒批，到点或凑满 flush（批量送出）', s:'ok', k:[
        {t:'Debouncer（防抖器）', d:'timer 用 get_running_loop()（当前事件循环）；get_event_loop 是坑，曾致 timer 失效'},
        {t:'merge_batch（合并批次）', d:'合并批次，保留 timestamp（时间戳）/ msg_id（消息ID）不断链'},
        {t:'触发判断', d:'SKIP（跳过）/ 随机 0.1 / @ 提及 / 热聊窗口，四选一'},
      ]},
      {t:'core flash 生成（核心）', r:'LLM 9000', d:'build system prompt（组装系统提示词：人设+画像+记忆+黑话注入）→ flash 4.1（快速模型）出回复', s:'ok', k:[
        {t:'人设注入', d:'流绑卡 persona_text（人设文本）'},
        {t:'画像/记忆/黑话', d:'profile_facts 画像事实 + memory_summaries 记忆摘要召回 + persona_slang 卡黑话'},
        {t:'触发热词', d:'aliases（称呼别名）识别（私聊称呼识别 bug 已修）'},
      ]},
      {t:'COMPLEXITY 判断（复杂度）', r:'flash 自己判', d:'一次调用内输出 [COMPLEXITY:1/3]（复杂度分档）；简单直接用，复杂转 PRO。不要默认简单', s:'ok', k:[
        {t:'=1 简单', d:'flash 输出整体采用，零额外成本'},
        {t:'=3 复杂', d:'flash 输出整体作废，PRO（专业模型）完整重跑'},
      ]},
      {t:'PRO 整体重跑（专业模型）', r:'仅复杂场景', d:'同一次调用换模型，不拆两次（输入占 96.8%，拆两次翻倍）', s:'ok', k:[
        {t:'重出正文', d:'不带 flash 正文，PRO 自己写'},
        {t:'旁路数据全重出', d:'方括号标记 + 工具调用 + reasoning（推理），一个不漏'},
        {t:'PRO 失败回落', d:'回落 flash 首次输出，不丢回复'},
      ]},
      {t:'旁路数据', r:'与回复同调用产出', d:'没发出去、但很重要；COMPLEXITY=3 时由 PRO 全量重出', s:'ok', k:[
        {t:'方括号标记', d:'正文内产出的旁路动作，不发给用户；COMPLEXITY=3 时全量重出', s:'ok', k:[
          {t:'[REPLY] [SKIP] [NEXT_INTERVAL]', d:'引用回复 / 本轮不参与 / 下次评估间隔'},
          {t:'[MOOD] [POKE] [SEND]', d:'好感变化 / 戳一戳 / 发文件（仅我）'},
          {t:'[PROFILE] 画像增量', d:'facts（事实）/ tags（标签）/ mood_reason（心情原因）三块画像增量'},
          {t:'兴趣点奖惩（三字段）', d:'✅ accuracy 准确度 0-10 / valence 态度 pos-neg-neutral / strength 强度 0-10 时间指数衰减；打分就写提示词，塞进 [PROFILE] 旁路扩展结构，跟其他回复中直接判断的一样塞', s:'ok'},
        ]},
        {t:'工具调用', d:'request_mention 选人 / request_sticker 选图 / set_mood 落好感 / query_cognitive 查记忆 / web_search 搜索 / query_config 查配置 等(仅我)'},
        {t:'reasoning_content（推理内容）', d:'推理内容，泄漏会拦截'},
      ]},
      {t:'outbox 发出去（出站）', r:'协议出站', d:'消息协议 /send_group_msg（发群消息）、/send_private_msg（发私聊消息）', s:'ok', k:[
            {t:'group / private / qzone 出站', d:'qzone 已有独立鉴权出站入口；生产带标记空间发布和好友互动已核对可见。日记按账号留档，结果未确认不自动重发；自动发布/好友互动开关按配置控制'},
      ]},
    ]
  },

  {
    id:'fragment', name:'② 群聊三条轨（订阅广播 / 本地碎片 / 本地兜底）',
    nodes:[
      {t:'群聊消息', r:'源·白名单群', d:'白名单群的消息一进来，就分叉出三条轨，各走各的游标，互不干扰', s:'ok', k:[
        {t:'为什么三条轨', d:'①订阅广播：固定15条切出去；②本地碎片升级：15条触发后按热聊窗口延伸（游标会跳）；③本地兜底：200条/6小时双触发。三者游标独立，否则互相踩脚'},
      ]},
      {t:'三条轨（分叉）', r:'三条游标', d:'点开看：轨A 订阅广播 / 轨B1 本地碎片升级 / 轨B2 本地兜底', s:'ok', k:[
        {t:'轨A｜订阅轮询（原订阅广播）', d:'✅ 已定（2026-11-03）：群不再自己切批推送，改成「订阅方角色卡按时间轴轮询各群收原文」——一次只看一个群，看完去下一个，拟人 + 错峰 + 不猛薅', s:'ok', k:[
          {t:'轮询游标（订阅方×群 独立）', d:'每个订阅方对每个被订阅群各记一条「上次看到哪」；轮到该群时，从游标往后拉，不是群攒够才拉', s:'ok'},
          {t:'拉取量', d:'15 条实质消息 或 20 分钟（先到先切，可配 10-20 条 / 10-40 分钟）；拉到哪推进到哪', s:'ok'},
          {t:'每轮之间歇', d:'✅ 已定（2026-11-03）：轮完一圈歇 10 分钟再开下一轮；默认 10 分钟，前端可配', s:'ok'},
          {t:'投递原文（不摘要）', d:'每个订阅方用自己的卡人设 + 对我的了解独立判断，不共用一个群本地摘要', s:'ok', k:[
            {t:'为什么不摘要', d:'群本地卡抓不到「私聊卡才懂的权重」——如私聊我的暗恋对象在某群，群本地摘要会漏掉这个重点；只有私聊卡自己看原文才提得起来'},
            {t:'私聊订阅方', d:'用该私聊流绑卡 + 对该我的了解判断'},
            {t:'群聊订阅方', d:'A群卡订阅B群（成员重叠才安全，靠我显式开关）'},
            {t:'空间不在此处', d:'空间不是订阅方'},
          ]},
          {t:'私聊线 冲动判断', r:'打分语义0-10', d:'打分=「是否愿意继续关注并跟用户吐槽」', s:'ok', k:[
            {t:'打分输入', d:'本轮拉到的原文（15条/20分钟）+ 最近10条本地私聊上下文'},
            {t:'用户意愿不硬减分', d:'角色卡下次打分自动结合语境判断用户意愿'},
            {t:'打分无痕', d:'用后即弃，不进上下文/记忆'},
          ]},
          {t:'热聊窗口状态机（私聊吐槽）', r:'阈值8/7', d:'push（推送开口）≥8开口；<7关窗；7~8中间态不push但继续关注', s:'ok', k:[
            {t:'开窗', d:'第一次冲动触发后开启；窗口内私聊上下文持续可见对应群最新消息'},
            {t:'≥8 push', d:'拉原文（回读50条）→组织分享语→私聊开口'},
            {t:'7~8中间态', d:'不push但继续关注，[NEXT_INTERVAL:30~600秒]自定下次再看'},
            {t:'<7关窗', d:'LLM自判话题结束/失去兴趣；关窗=合并整个窗口期生成摘要升级落库', s:'ok', k:[
              {t:'落私聊流 summary', d:'push 后的讨论也并进同一条摘要，记在私聊流里；与私聊兜底摘要轨做时间去重'},
            ]},
            {t:'push后续', d:'进入「等你接话」挂起态（2026-11-11 已接：等接收会话新消息后才可再次分享）'},

          {t:'群聊线（订阅吐槽）', r:'冲动≥8', d:'B群卡拿A群碎片吐槽，落B群自己的记忆', s:'ok', k:[
            {t:'打分输入（跨群语境）', d:'✅ 已定：跨群语境对照——隔壁群也在聊同话题时，bot 可附和参照（如「这剧情隔壁群也怎么怎么说」），对整体语境和氛围打分，不是给特定人回复', s:'ok'},
          ]},
        ]},
        {t:'轨B1｜本地碎片升级（游标B1）', d:'15条/20分钟触发 → 打分「值得记录」→ ≥7开窗延伸 → <7关窗合并升级', s:'ok', k:[
          {t:'游标B1', d:'独立；触发升级后按热聊窗口往后延伸，游标会跳到窗口结束处，非固定15步进'},
          {t:'打分语义「值得记录」', d:'由角色卡自己判断这段值不值得记（0-10），不是「参与话题意愿度」也不是「值得吐槽」', s:'ok', k:[
            {t:'复用私聊热聊状态机', d:'只有打分语义不同；窗口延伸、关窗合并、打分无痕都复用'},
            {t:'打分无痕', d:'用后即弃，防上一轮分数锚定下一轮（治大模型倾向打高/不肯关窗）'},
          ]},
          {t:'阈值判断 ≥7 开窗', d:'≥7 触发记录窗口；<7 直接丢弃不落库（chat_messages 本就存原文，碎片落库=再存一遍冗余）', s:'ok'},
          {t:'输入 45条原文 + 延伸窗口', d:'15×3=45条原文是开窗引子；开窗后持续喂入后续消息，直到关窗为止', s:'ok'},
          {t:'阈值判断 <7 关窗', d:'LLM 判断话题结束/失去兴趣 → <7 关窗（值得记录=注意力焦点；失去兴趣=不值得记了）', s:'ok', k:[
            {t:'关窗合并整窗口', d:'从触发那 45 条到关窗为止的所有消息，整体调 /v1/summary 升级，importance 给定 7，不再让 LLM 重新判分'},
            {t:'关窗后游标跳窗口尾', d:'游标跳到窗口结束处，重新开始 15 条切'},
          ]},
        ]},
        {t:'轨B2｜老summary兜底（游标B2）', d:'200条/6小时 双触发 → SKIP 或摘要（不升级）', s:'ok', k:[
          {t:'游标B2', d:'独立推进，不因轨B1的15条切批而动'},

  {t:'【缺陷】戳一戳判定不严：群友戳群友也触发本号', d:'🔴 我 2026-11-07 反馈：群聊里 A 戳 B（与 bot 无关），bot 也会回戳或回应，没判定这个戳是不是戳他。根因已定位：pipeline.py:379 写的是 if target_user_id and target_user_id != scope.uin: return —— target_user_id 为空字符串时 falsy，条件整体短路为 False，于是不 return、当成"戳我了"。而 parse.py:78 的 target_user_id 取自 payload["target_id"]，消息协议 各实现字段名不一致，消息协议端 若未上报 target_id 就是空。注：parse.py:99 的 is_at_bot 其实算对了（空→0=不是戳我），但 pipeline 没读它，自己又算了一遍且算错了。2026-11-06 修的是 sender_id（操作者），本次是 target_user_id（被戳者），两个字段不同所以上次没覆盖。修复三选一：A=pipeline 直接读 is_at_bot 不复算（推荐）；B=379 行改成 not target_user_id 也 return（改动最小）；C=parse 层补齐字段取值使永不为空（需先确认真实报文）。影响：群聊任意两人互相 poke 都可能触发 bot，且污染 poke_tracker 高频计数。'},

  {t:'【状态】persona_status 插件（三条数值）', d:'本地已补齐并接入 Vue（2026-11-12）：三条状态按真实经过时间投影，查询不写库，多账号共卡不重复累计；精力只由时间轴活动改变，聊天不扣精力；欲望仅卡我私聊，满足事件减60且同事件只结算一次。生活页已展示状态和变化原因；夜间主动窗口、欲望概率曲线和连续六段欲望表现已接入，本地真实账号启用与消息验收未执行。'},

/* ============ 渲染逻辑（一般不用动） ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let curChain = ARCH_DATA.chains[0].id;
let drillStack = [];   // 钻取路径：node 数组

function statusDot(s){ return {'ok':'<span style="color:var(--ok)">●</span>',
  'warn':'<span style="color:var(--warn)">●</span>',
  'no':'<span style="color:var(--no)">●</span>'}[s] || ''; }

/* ---- 标签页 ---- */
$('#tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const v = t.dataset.view;
  ['chains','tree','features','pending','todo'].forEach(x=>{ $('#view-'+x).style.display = x===v?'':'none'; });
});

/* ---- 链路栏 ---- */
function renderChainBar(){
  $('#chainbar').innerHTML = ARCH_DATA.chains.map(c =>
    `<div class="chain-btn ${c.id===curChain?'active':''}" data-id="${c.id}">${esc(c.name)}</div>`).join('');
}
$('#chainbar').addEventListener('click', e=>{
  const b = e.target.closest('.chain-btn'); if(!b) return;
  curChain = b.dataset.id; drillStack = [];
  renderChainBar(); renderFlow(); renderDrill();
});

/* ---- 链路主流程 ---- */
function renderFlow(){
  const chain = ARCH_DATA.chains.find(c=>c.id===curChain);
  const lastIdx = chain.nodes.length - 1;
  $('#flow').innerHTML = chain.nodes.map((n,i)=>{
    const sel = drillStack.length && drillStack[0].t===n.t ? ' sel' : '';
    return (i>0?'<div class="arrow">→</div>':'') +
      `<div class="node${sel}" data-idx="${i}">
         <span class="kids">${(n.k||[]).length? (n.k||[]).length :''}</span>
         <div class="t">${statusDot(n.s)} ${esc(n.t)}</div>
         <div class="r">${esc(n.r||'')}</div>
       </div>`;
  }).join('');
}
$('#flow').addEventListener('click', e=>{
  const n = e.target.closest('.node'); if(!n) return;
  const chain = ARCH_DATA.chains.find(c=>c.id===curChain);
  drillStack = [chain.nodes[+n.dataset.idx]];
  renderFlow(); renderDrill();
});

/* ---- 钻取详情 ---- */
function renderDrill(){
  const box = $('#drill');
  if(!drillStack.length){ box.innerHTML = '<p style="color:var(--muted);font-size:13px;">↑ 点上面任意模块查看它干什么、下面跟了哪些东西。</p>'; return; }
  const path = drillStack.map((n,i)=>
    i===drillStack.length-1 ? `<b>${esc(n.t)}</b>` :
    `<a data-up="${i}">${esc(n.t)}</a>`).join(' › ');
  const n = drillStack[drillStack.length-1];
  const kids = (n.k||[]).map((k,j)=>
    `<div class="sub" data-kid="${j}">
       <div class="t">${statusDot(k.s)} ${esc(k.t)}</div>
       <div class="d">${esc(k.d||'')}</div>
     </div>`).join('');
  box.innerHTML = `
    <div class="crumb">${drillStack.length>1?'<span class="back" data-up="0">‹ 返回顶层</span> · ':''}${path}</div>
    <div class="summary"><span class="role">${esc(n.r||'')}</span>${esc(n.d||'')}</div>
    ${kids?`<div class="subgrid">${kids}</div>`:'<p style="color:var(--muted);font-size:13px;">（此模块无子项，已是叶子节点）</p>'}
  `;
}
$('#drill').addEventListener('click', e=>{
  const up = e.target.closest('[data-up]');
  if(up){ drillStack = drillStack.slice(0, +up.dataset.up + 1); renderFlow(); renderDrill(); return; }
  const k = e.target.closest('.sub');
  if(k){ const n = drillStack[drillStack.length-1]; drillStack.push(n.k[+k.dataset.kid]); renderFlow(); renderDrill(); }
});

/* ---- 总览树 ---- */
function renderTree(){
  const root = ARCH_DATA.tree;
  $('#tree').innerHTML = '<ul>'+treeNode(root, true)+'</ul>';
  $('#tree').addEventListener('click', e=>{
    const tn = e.target.closest('.tnode'); if(!tn) return;
    tn.classList.toggle('open');
    const ul = tn.parentElement.querySelector(':scope > ul');
    if(ul) ul.style.display = ul.style.display==='none'?'':'none';
  });
}
function treeNode(n, root){
  const kids = (n.k||[]).map(k=>treeNode(k,false)).join('');
  const tw = kids ? `<span class="tw">▶</span>` : '';
  const hasKids = kids ? ' has-kids' : '';
  return `<li>
    <span class="tnode ${n.s||''}${hasKids}">${tw}${statusDot(n.s)}${esc(n.t)}
      <span class="badge">${n.r||''}</span></span>
      <span class="desc">${esc(n.d||'')}</span>
    ${kids?`<ul style="display:${root?'':'none'}">${kids}</ul>`:''}
  </li>`;
}

/* ---- 功能清单（全功能盘点：防止重构漏迁） ---- */
function renderFeatures(){
  const rows = ARCH_DATA.features.map(f=>{
    const st = {'ok':'<span class="ok">已定稿</span>','warn':'<span class="warn">待拍板</span>','no':'<span class="no">已否掉</span>'}[f.s]||'';
    const im = {'done':'<span style="color:var(--ok)">已实现</span>','partial':'<span style="color:var(--warn)">部分实现</span>','todo':'<span style="color:var(--muted)">未实现</span>','online':'<span style="color:var(--warn)">仅线上</span>','-':''}[f.impl]||'';
    return `<div class="feat">
      <div class="fh"><b>${esc(f.t)}</b> ${st} ${im}</div>
      <div class="fl">
        <span><i>触发</i>${esc(f.trig||'')}</span>
        <span><i>产出</i>${esc(f.out||'')}</span>
        <span><i>存哪</i>${esc(f.store||'')}</span>
        <span><i>谁用</i>${esc(f.use||'')}</span>
        <span><i>收尾</i>${esc(f.end||'')}</span>
      </div>
    </div>`;
  }).join('');
  $('#features').innerHTML = rows;
}
function renderPending(){
  const items = ARCH_DATA.pending;
  $('#pending').innerHTML = items.length === 0
    ? '<p class="empty">✅ 暂无待拍板项——设计已全部定稿。后续只加功能、不改架构。</p>'
    : '<ul class="pending">' + items.map(p=>`<li><span class="warn">⚠️</span> <b>${esc(p.t)}</b>：${esc(p.d)}</li>`).join('') + '</ul>';
}

/* ---- 实现待办清单（设计已定，代码没做） ---- */
function renderTodo(){
  $('#todo').innerHTML = '<ul class="pending">' +
    ARCH_DATA.todo.map(p=>`<li><span style="color:var(--muted)">🔧</span> <b>${esc(p.t)}</b>：${esc(p.d)}</li>`).join('') +
    '</ul>';
}

renderChainBar(); renderFlow(); renderDrill(); renderTree(); renderFeatures(); renderPending(); renderTodo();
</script>
